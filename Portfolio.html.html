:root{--bgD:#0a1a52;--bgL:#2a57d8;--sticker:#2f6bff;--rim:#a9c4ff;--ink:#081040;--cream:#fff6d6;--pop:#ffe500;--popInk:#081040;--fg:#f3f6ff;
--grid:color-mix(in srgb,var(--pop) 30%,transparent);
--display:"Fredoka One","Poppins Fat","Arial Black",Impact,system-ui,sans-serif;--ui:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bgD);color:var(--fg);font-family:var(--ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
body:not(.editing) .eonly{display:none!important}

/* ===== canvas ===== */
#stage{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;image-rendering:pixelated;background-color:var(--bgD)}
#stage.panning{cursor:grabbing}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 40%,color-mix(in srgb,var(--ink) 60%,transparent) 115%)}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;image-rendering:auto;--iz:1}
.ruler{position:fixed;z-index:10;pointer-events:none}
#rx{left:0;top:0;width:100%;height:20px}#ry{left:0;top:0;width:20px;height:100%}
#rc{left:0;top:0;width:20px;height:20px;background:var(--ink);z-index:11}

/* ===== editable text ===== */
.ed{outline:none;min-width:.6em}
.ed.multi{white-space:pre-wrap}
.editing .ed{cursor:text;user-select:text;-webkit-user-select:text;border-radius:3px}
.editing .ed:hover{outline:1.5px dashed currentColor;outline-offset:3px}
.editing .ed:focus{outline:2px solid currentColor;outline-offset:3px}
.editing .ed:empty::before{content:attr(data-ph);opacity:.45}

/* ===== frames ===== */
.frame{position:absolute;border:1.5px dashed color-mix(in srgb,var(--pop) 55%,transparent);border-radius:10px;pointer-events:none}
.fname{position:absolute;left:0;bottom:100%;margin-bottom:8px;display:flex;gap:8px;align-items:center;font:700 14px var(--mono);color:var(--pop);pointer-events:auto;white-space:nowrap;transform-origin:0 100%;transform:scale(var(--iz))}
.fico{display:inline-grid;place-items:center;width:20px;height:20px;border:1.5px solid var(--pop);border-radius:4px;font-size:11px}
.editing .fico{cursor:move;background:var(--pop);color:var(--popInk)}
.knob{position:absolute;width:16px;height:16px;background:#fff;border:2.5px solid var(--pop);border-radius:50%;pointer-events:auto;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.knob.fr{right:-8px;bottom:-8px;border-radius:3px;cursor:nwse-resize;transform:scale(var(--iz))}

/* ===== hero ===== */
.hero{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:max-content}
.wm{position:relative;rotate:-2.5deg;margin-bottom:58px}
.wm-name{margin:0;font:400 196px/1 var(--display);color:var(--cream);white-space:nowrap;letter-spacing:.012em;filter:url(#stickerize);padding:6px 26px 2px;text-transform:uppercase}
.wm-name .ch{display:inline-block;transform:translateY(var(--dy,0px)) rotate(var(--rot,0deg));transform-origin:50% 85%}
.intro .wm-name .ch{animation:drop .75s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i)*45ms + 120ms)}
@keyframes drop{from{transform:translateY(-150px) rotate(-18deg) scale(.4);opacity:0}}
.wm-name .ch.boing{animation:boing .6s}
@keyframes boing{30%{transform:translateY(-26px) rotate(-7deg) scale(1.08,.94)}62%{transform:translateY(6px) rotate(3deg) scale(.96,1.05)}}
.wm-tag{position:absolute;right:-6px;bottom:-42px;rotate:-3deg;font:400 54px/1 var(--display);background:var(--pop);color:var(--popInk);padding:11px 20px 8px;border-radius:16px;border:5px solid var(--ink);box-shadow:0 0 0 5px var(--pop),0 14px 22px -8px rgba(0,0,0,.5);white-space:nowrap;text-transform:uppercase;letter-spacing:.02em}
.intro .wm-tag{animation:slap .5s cubic-bezier(.2,1.6,.4,1) .75s both}
@keyframes slap{from{scale:2.2;rotate:14deg;opacity:0}}
.selbox{position:absolute;inset:-30px -34px -52px;border:1.5px solid var(--pop);opacity:0;transition:opacity .2s;pointer-events:none}
.wm:hover .selbox{opacity:1}.editing .selbox{display:none}
.selbox i{position:absolute;width:10px;height:10px;background:#fff;border:1.5px solid var(--pop)}
.selbox i:nth-child(1){left:-5px;top:-5px}.selbox i:nth-child(2){right:-5px;top:-5px}.selbox i:nth-child(3){left:-5px;bottom:-5px}.selbox i:nth-child(4){right:-5px;bottom:-5px}
.selbox b{position:absolute;left:50%;top:100%;translate:-50% 8px;background:var(--pop);color:var(--popInk);font:700 12px var(--mono);padding:3px 7px;border-radius:4px;white-space:nowrap}
.tagline{max-width:480px;text-align:center;font:500 21px/1.42 var(--ui);color:var(--fg);margin:0 0 22px;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.pills{display:flex;gap:10px}
.pill{border:1.5px solid var(--pop);background:color-mix(in srgb,var(--ink) 72%,transparent);color:var(--cream);padding:10px 18px;border-radius:999px;font:600 17px var(--ui);transition:.18s cubic-bezier(.2,1.4,.4,1)}
button.pill:hover{background:var(--pop);color:var(--popInk);translate:0 -3px;rotate:-2deg}
.intro .tagline,.intro .pills{animation:rise .6s ease-out 1s both}
@keyframes rise{from{translate:0 18px;opacity:0}}

/* ===== items ===== */
.item{position:absolute;transform:translate(-50%,-50%) rotate(var(--r,0deg)) scale(var(--s,1));--is:1}
.item:hover{z-index:5}.item.dragging{z-index:9}
.item.pop>:first-child{animation:popin .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes popin{from{scale:.4;opacity:0}}
.item.wig>:first-child{animation:wig .5s}
@keyframes wig{30%{rotate:-8deg;scale:1.08}60%{rotate:6deg}}
.t-sticker{cursor:grab}.t-sticker.dragging{cursor:grabbing}
.t-sticker>:first-child{filter:drop-shadow(0 10px 10px rgba(0,0,0,.3))}
.stk svg,.burst svg,.badge svg{display:block}

/* project card */
.card{position:relative;width:420px;background:var(--cream);color:var(--ink);border-radius:20px;padding:12px 12px 15px;border:2.5px solid var(--ink);box-shadow:0 26px 40px -18px rgba(0,0,0,.6);cursor:pointer;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--hs,1));transition:transform .2s ease-out,box-shadow .2s}
.t-project:hover .card{--hs:1.035;box-shadow:0 0 0 5px var(--pop),0 34px 50px -18px rgba(0,0,0,.65)}
.card:focus-visible{outline:4px solid var(--pop);outline-offset:4px}
.card .num{position:absolute;left:-12px;top:-14px;z-index:2;background:var(--pop);color:var(--popInk);border:2.5px solid var(--ink);font:700 14px var(--mono);padding:4px 9px;border-radius:999px;rotate:-8deg}
.card h3{font:400 27px/1.05 var(--display);margin:13px 4px 4px}
.card .tags{font:500 14px/1.3 var(--ui);opacity:.72;margin:0 4px}
.card .open{position:absolute;top:24px;right:24px;width:46px;height:46px;border-radius:50%;background:var(--pop);color:var(--popInk);border:2.5px solid var(--ink);display:grid;place-items:center;scale:0;rotate:-45deg;transition:.22s cubic-bezier(.2,1.5,.4,1)}
.t-project:hover .open,.editing .card .open{scale:1;rotate:0deg}
@media (hover:none){.card .open{scale:1;rotate:0deg}}

/* media slots */
.slot{position:relative;border-radius:11px;overflow:hidden;border:2px solid var(--ink);background:var(--ink)}
.card .slot{aspect-ratio:4/3}
.slot-fill{width:100%;height:100%}.slot-fill img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none}
.slot-fill .art{width:100%;height:100%;display:block}
.slot.free .slot-fill img{height:auto}.slot.free .slot-fill.ph{aspect-ratio:4/3}
.slot.drop{outline:4px dashed var(--pop);outline-offset:-8px}
.slot-ui{position:absolute;left:8px;bottom:8px;display:flex;gap:6px}
.slot-ui button{display:flex;align-items:center;gap:6px;background:var(--ink);color:var(--cream);border:1.5px solid var(--pop);border-radius:999px;padding:6px 11px;font:600 12.5px var(--ui)}
.slot-ui button:hover{background:var(--pop);color:var(--popInk)}
.ph-hint{position:absolute;inset:0;display:grid;place-items:center;font:700 13px var(--mono);color:#fff;text-shadow:0 1px 3px #000;pointer-events:none;text-align:center;padding:0 20px 36px}
/* label / note / picture */
.lab{display:flex;gap:12px;align-items:center;font:600 30px var(--ui);color:var(--fg);white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.lab i{font-style:normal;color:var(--pop);font-size:24px}
.note{width:300px;padding:22px 22px 26px;background:var(--nb);color:var(--nf);border-radius:4px 4px 22px 4px;box-shadow:0 22px 30px -16px rgba(0,0,0,.6)}
.note h4{font:400 26px/1.05 var(--display);margin:0 0 8px}.note p{font:500 16px/1.45 var(--ui);margin:0}
.c-pop{--nb:var(--pop);--nf:var(--popInk)}.c-cream{--nb:var(--cream);--nf:var(--ink)}.c-ink{--nb:var(--ink);--nf:var(--cream)}.c-coral{--nb:#ff5a36;--nf:#fff}.c-pink{--nb:#ff8fc7;--nf:#3a0b25}.c-mint{--nb:#3ddc97;--nf:#06301f}
.pic{width:460px;background:var(--cream);padding:10px;border-radius:14px;border:2.5px solid var(--ink);box-shadow:0 24px 36px -18px rgba(0,0,0,.6)}
.capline{margin:8px 4px 2px;font:500 14px var(--ui);color:var(--ink)}.capline:empty{display:none}.editing .capline:empty{display:block}

/* stickers */
.eyes{display:flex;gap:6px}.eye{width:74px;height:92px;border-radius:50%;background:#fff;border:5px solid var(--ink);display:grid;place-items:center}
.pupil{width:44%;height:40%;border-radius:50%;background:var(--ink);display:block;transition:transform .08s linear}
.cur{display:flex;align-items:flex-start;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{translate:6px -9px}}
.cur-tag{margin:22px 0 0 -4px;background:var(--pop);color:var(--popInk);border:2px solid var(--ink);border-radius:4px 12px 12px 12px;padding:4px 10px;font:700 15px var(--ui);white-space:nowrap}
.bubble{position:relative;background:var(--cream);color:var(--ink);border:4px solid var(--ink);border-radius:26px;padding:14px 20px;font:700 22px/1.2 var(--ui);max-width:270px;box-shadow:6px 7px 0 var(--ink)}
.bubble::after{content:"";position:absolute;left:34px;bottom:-15px;width:22px;height:22px;background:var(--cream);border:solid var(--ink);border-width:0 4px 4px 0;rotate:45deg}
.burst{position:relative;display:grid;place-items:center}.burst b{position:absolute;font:400 30px var(--display);color:#fff;rotate:-10deg;white-space:nowrap}
.badge .spin{animation:spin 16s linear infinite;transform-origin:100px 100px}
@keyframes spin{to{transform:rotate(360deg)}}

/* about */
.about{display:flex;gap:54px;align-items:center;width:1120px}
.photo{position:relative;flex:0 0 340px;rotate:-4deg;background:var(--cream);padding:12px 12px 46px;border-radius:8px;box-shadow:0 30px 44px -20px rgba(0,0,0,.65)}
.photo .slot{aspect-ratio:4/5;border-radius:4px;border:0}
.tape{position:absolute;left:50%;top:-18px;width:130px;height:36px;translate:-50% 0;rotate:3deg;background:color-mix(in srgb,var(--pop) 80%,transparent);box-shadow:0 2px 4px rgba(0,0,0,.2)}
.kicker{font:700 14px var(--mono);color:var(--pop);letter-spacing:.14em;text-transform:uppercase}
.about h2{font:400 84px/.98 var(--display);margin:12px 0 18px;color:var(--cream);text-shadow:0 5px 0 var(--ink)}
.about p{font:500 20px/1.55 var(--ui);margin:0 0 18px;color:var(--fg)}
.now{display:flex;gap:10px;align-items:center;font:600 16px var(--ui);margin-bottom:22px}
.dot{width:10px;height:10px;border-radius:50%;background:#3ddc97;box-shadow:0 0 0 0 #3ddc97;animation:ping 1.8s infinite}
@keyframes ping{to{box-shadow:0 0 0 12px transparent}}
.links{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;background:var(--pop);color:var(--popInk);border:2.5px solid var(--ink);border-radius:999px;padding:10px 18px;font:700 16px var(--ui);box-shadow:0 5px 0 var(--ink);transition:.15s}
a.btn:hover,button.btn:hover{translate:0 3px;box-shadow:0 2px 0 var(--ink)}
.btn.dark{background:var(--ink);color:var(--cream);box-shadow:0 5px 0 color-mix(in srgb,var(--ink) 55%,transparent)}
.btn.unset{border-style:dashed}
.editing .btn.unset::after{content:"";width:9px;height:9px;border-radius:50%;background:#ff5a36;border:1.5px solid var(--ink)}
.btn svg{width:16px;height:16px}
.mini{width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;background:transparent;display:inline-grid;place-items:center;padding:0;flex:none}
.mini svg{width:13px;height:13px}.mini:hover{background:var(--ink);color:var(--pop)}
.ghost{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1.5px dashed currentColor;border-radius:999px;padding:9px 15px;font:600 14px var(--ui);color:var(--cream)}
.ghost.dark{color:var(--ink)}.ghost:hover{background:color-mix(in srgb,currentColor 14%,transparent)}

/* resume / tools */
.resume{width:920px;background:var(--cream);color:var(--ink);border:2.5px solid var(--ink);border-radius:26px;padding:44px 48px;box-shadow:0 0 0 6px var(--pop),0 40px 60px -24px rgba(0,0,0,.6)}
.res-head{display:flex;justify-content:space-between;align-items:center;gap:20px}
.resume h2{font:400 66px/1 var(--display);margin:0}
.res-intro{font:500 18px/1.5 var(--ui);margin:14px 0 22px;max-width:640px}
.row{position:relative;display:grid;grid-template-columns:170px 1fr 30px;gap:18px;padding:20px 0;border-top:2px solid color-mix(in srgb,var(--ink) 16%,transparent)}
.when{font:700 14px/1.6 var(--mono);opacity:.7}
.row h4{font:700 22px/1.2 var(--ui);margin:0}.org{font:600 16px var(--ui);color:color-mix(in srgb,var(--ink) 70%,var(--sticker))}
.row p{font:500 15.5px/1.5 var(--ui);margin:6px 0 0;opacity:.85}
.tools{width:520px;background:var(--ink);color:var(--cream);border:2px solid var(--pop);border-radius:22px;padding:24px 26px;box-shadow:0 26px 40px -20px rgba(0,0,0,.6)}
.tools h4{font:400 30px var(--display);margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{border:1.5px solid var(--pop);border-radius:999px;padding:6px 13px;font:600 15px var(--ui)}
.chipline{font:500 16px/1.5 var(--ui);margin:0}.tools small{display:block;margin-top:8px;opacity:.6;font:500 12px var(--mono)}

/* edit chrome on items */
.editing .item:hover{outline:calc(1.5px*var(--iz)*var(--is)) dashed var(--pop);outline-offset:calc(8px*var(--is))}
.editing .item.sel{outline:calc(2.5px*var(--iz)*var(--is)) solid var(--pop);outline-offset:calc(8px*var(--is));z-index:8}
.chrome{position:absolute;inset:calc(-8px*var(--is));pointer-events:none;display:none}
.editing .item.sel .chrome{display:block}
.tb{position:absolute;left:50%;bottom:100%;translate:-50% -10px;transform:scale(calc(var(--iz)*var(--is)));transform-origin:50% 100%;display:flex;gap:2px;background:var(--ink);border:1.5px solid var(--pop);border-radius:12px;padding:4px;pointer-events:auto;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.tb button{min-width:34px;height:34px;border-radius:8px;border:0;background:transparent;color:var(--cream);display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;font:700 12px var(--mono)}
.tb button:hover{background:var(--pop);color:var(--popInk)}.tb .grip{cursor:move}
.chrome .knob{transform:scale(calc(var(--iz)*var(--is)))}
.chrome .rot{right:-8px;top:-8px;cursor:grab}.chrome .scl{right:-8px;bottom:-8px;border-radius:3px;cursor:nwse-resize}
/* ===== fixed UI ===== */
.ui{position:fixed;z-index:20}
.glass{background:color-mix(in srgb,var(--ink) 84%,transparent);border:1.5px solid color-mix(in srgb,var(--pop) 45%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--cream)}
#topnav{top:32px;left:50%;translate:-50% 0;display:flex;gap:4px;padding:5px;border-radius:999px}
#topnav button{border:0;background:transparent;border-radius:999px;padding:8px 14px;font:600 14px var(--ui);white-space:nowrap;transition:.15s}
#topnav button:hover{background:color-mix(in srgb,var(--pop) 22%,transparent)}
#topnav button.on{background:var(--pop);color:var(--popInk)}
#topnav .logo{background:var(--pop);color:var(--popInk);font:400 15px var(--display);min-width:36px;padding:8px 10px}
#topright{top:32px;right:16px;display:flex;gap:10px;align-items:center}
#status{font:600 12px var(--mono);color:var(--cream);opacity:.75}
#editBtn{border-radius:999px;padding:9px 16px;font:700 14px var(--ui);display:flex;gap:8px;align-items:center}
#editBtn:hover,.editing #editBtn{background:var(--pop);color:var(--popInk)}
#hint{bottom:22px;left:50%;translate:-50% 0;display:flex;gap:10px;align-items:center}
.editing #hint{display:none}
.hint-pill{background:var(--cream);color:var(--ink);font:700 16px var(--ui);padding:9px 17px;border-radius:999px;box-shadow:0 8px 18px rgba(0,0,0,.35);animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{50%{translate:0 -4px}}
.hint-ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;padding:0}
.hint-ico:hover{background:var(--pop);color:var(--popInk)}
#zoom{left:32px;bottom:18px;display:flex;align-items:center;border-radius:12px;padding:3px;gap:2px;font:600 12px var(--mono)}
#zoom button{border:0;background:transparent;min-width:30px;height:30px;border-radius:8px;font:700 13px var(--mono)}
#zoom button:hover{background:var(--pop);color:var(--popInk)}
#coords{padding:0 10px 0 6px;opacity:.75;white-space:pre}
#mini{right:16px;bottom:18px;width:200px;height:132px;border-radius:12px;cursor:crosshair;touch-action:none}
#editbar{bottom:18px;left:50%;translate:-50% 0;display:flex;gap:3px;padding:5px;border-radius:16px;max-width:calc(100vw - 24px);overflow-x:auto}
#editbar button{display:flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:11px;padding:9px 12px;font:600 14px var(--ui);white-space:nowrap}
#editbar button:hover{background:color-mix(in srgb,var(--pop) 24%,transparent)}
#editbar button.pri{background:var(--pop);color:var(--popInk)}
#editbar .sep{width:1.5px;margin:6px 4px;background:color-mix(in srgb,var(--pop) 40%,transparent)}
#panel{bottom:78px;left:50%;translate:-50% 0;width:min(430px,calc(100vw - 24px));max-height:calc(100vh - 150px);overflow:auto;border-radius:18px;padding:18px;z-index:21}
#panel[hidden]{display:none}
#panel h5{margin:0 0 10px;font:700 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--pop)}
#panel h5:not(:first-child){margin-top:18px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{display:flex;align-items:center;gap:7px;border:1.5px solid transparent;border-radius:999px;background:color-mix(in srgb,#fff 8%,transparent);padding:5px 12px 5px 5px;font:600 13px var(--ui)}
.sw::before{content:"";width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--a) 0 33%,var(--b) 0 66%,var(--c) 0);border:1.5px solid #fff}
.sw.on{border-color:var(--pop)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.fields label{display:flex;justify-content:space-between;align-items:center;gap:8px;font:500 13px var(--ui)}
.fields label.wide{grid-column:1/-1}
.fields input[type=color]{width:38px;height:28px;border:1.5px solid var(--cream);border-radius:8px;background:none;padding:0;cursor:pointer}
.fields input[type=text],.fields select,#ask input{flex:1;min-width:0;background:color-mix(in srgb,#fff 10%,transparent);color:var(--cream);border:1.5px solid color-mix(in srgb,var(--cream) 40%,transparent);border-radius:9px;padding:8px 10px;font:500 14px var(--ui)}
.fields select option{color:#111}
.stkgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stkgrid button{aspect-ratio:1;border:1.5px solid color-mix(in srgb,var(--cream) 25%,transparent);border-radius:12px;background:color-mix(in srgb,#fff 6%,transparent);display:grid;place-items:center;font:700 11px var(--mono);overflow:hidden}
.stkgrid button:hover{border-color:var(--pop)}.stkgrid svg{width:46px;height:46px}
.list{display:grid;gap:8px}
.list button{text-align:left;border:1.5px solid color-mix(in srgb,var(--cream) 25%,transparent);background:color-mix(in srgb,#fff 6%,transparent);border-radius:12px;padding:11px 13px;font:700 14px var(--ui)}
.list button small{display:block;font:500 12px/1.4 var(--ui);opacity:.7;margin-top:2px}
.list button:hover{border-color:var(--pop)}.list button.pri{background:var(--pop);color:var(--popInk)}

/* ===== project modal ===== */
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:color-mix(in srgb,var(--ink) 74%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:clamp(10px,3vw,40px)}
#modal.on{display:flex}
.sheet{width:min(1200px,100%);height:min(780px,100%);background:var(--cream);color:var(--ink);border-radius:26px;border:3px solid var(--ink);box-shadow:0 0 0 6px var(--pop),0 40px 80px rgba(0,0,0,.5);display:grid;grid-template-columns:1.35fr 1fr;overflow:hidden;animation:sheet .35s cubic-bezier(.2,1.2,.3,1)}
@keyframes sheet{from{scale:.86;rotate:-2deg;opacity:0}}
.m-media{overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px;background:color-mix(in srgb,var(--ink) 9%,var(--cream))}
.m-media .slot{flex:none}.m-media .slot .slot-fill img{height:auto}.m-media .slot .slot-fill.ph{aspect-ratio:4/3}
.m-gal{display:flex;flex-direction:column;gap:14px}.m-gal:empty{display:none}
.m-gal figure{position:relative;margin:0;border:2px solid var(--ink);border-radius:11px;overflow:hidden}.m-gal img{display:block;width:100%}
.m-gal .mini{position:absolute;top:8px;right:8px;background:var(--cream)}
.m-side{padding:28px 30px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.m-top{display:flex;justify-content:space-between;align-items:center}
.m-kicker{font:700 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;opacity:.65}
.m-side h2{font:400 46px/1 var(--display);margin:0}
.m-tags{font:600 15px var(--ui);margin:0;opacity:.7}
.m-meta{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:4px 0;padding:14px 0;border-block:2px solid color-mix(in srgb,var(--ink) 15%,transparent)}
.m-meta dt{font:700 12px/1.9 var(--mono);text-transform:uppercase;opacity:.6}.m-meta dd{margin:0;font:600 16px var(--ui)}
.m-desc{font:500 16.5px/1.6 var(--ui);margin:0}
.m-nav{margin-top:auto;display:flex;gap:8px;padding-top:10px}
.m-nav button,.m-close{border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:9px 16px;font:700 14px var(--ui);display:inline-flex;gap:6px;align-items:center}
.m-close{width:40px;height:40px;padding:0;justify-content:center}
.m-nav button:hover,.m-close:hover{background:var(--ink);color:var(--cream)}
@media (max-width:820px){.sheet{grid-template-columns:1fr;height:100%;overflow:auto}.m-media,.m-side{overflow:visible}#mini,#coords,#status{display:none}#topnav button{padding:8px 10px;font-size:13px}#topright{top:auto;bottom:66px;right:12px}}

/* ===== toast / dialog ===== */
#toast{position:fixed;left:50%;top:84px;translate:-50% -20px;z-index:60;border-radius:999px;padding:10px 18px;font:600 14px var(--ui);opacity:0;pointer-events:none;transition:.25s;max-width:calc(100vw - 30px);text-align:center}
#toast.on{opacity:1;translate:-50% 0}
#ask{border:2px solid var(--pop);border-radius:20px;background:var(--ink);color:var(--cream);padding:22px;width:min(440px,calc(100vw - 30px));font-family:var(--ui)}
#ask::backdrop{background:rgba(0,0,0,.5)}
